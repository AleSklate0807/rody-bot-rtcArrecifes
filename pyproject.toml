[project]
name = "rody-bot"
version = "1.0.0"
description = "Asistente virtual de Rotaract Club Arrecifes en Telegram, con memoria por socio y Gemini."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
